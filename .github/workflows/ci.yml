name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc --version && cargo --version && python3 --version

      - name: Install elan (Lean 4.30.0)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz && ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: No unsafe, no std in the core
        run: |
          ! grep -rnw 'unsafe' crates/deflate-core/src/
          ! grep -rnw 'std' crates/deflate-core/src/

      - name: Lean model (lake build, no sorry/native_decide, axiom gate)
        run: |
          lake build
          if grep -rnwE 'sorry|admit|native_decide' spec/ --include='*.lean'; then
            echo "::error::sorry/admit/native_decide present in Lean sources"; exit 1
          fi
          lake env lean spec/scripts/axioms.lean | tee axioms.log
          if grep -qE 'sorryAx|ofReduceBool' axioms.log; then
            echo "::error::a headline theorem depends on sorryAx or ofReduceBool"; exit 1
          fi

      - name: Differential harness self-test
        run: python3 oracles/differential.py --self-test

      - name: Differential harness (Rust vs Lean model vs zlib)
        run: |
          cargo build --release --workspace
          lake build
          python3 oracles/differential.py

