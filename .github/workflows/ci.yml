name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc --version && cargo --version && python3 --version

      - name: Install elan (Lean 4.30.0)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz && ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          sh scripts/test_axiom_gate.sh
          cargo test --workspace
          cargo test --workspace --all-features
          python3 scripts/tuning_report.py --check
          python3 scripts/test_encoder_tools.py
          python3 scripts/test_encoder_parse.py
          python3 scripts/test_encoder_selector.py
          python3 scripts/test_encoder_final.py
          python3 scripts/test_encoder_final_artifacts.py
          make research-check
          make research-defaults
          make research-policy-check
          make research-cost-check
          make research-mixed-check
          make research-final-check

      - name: Optional CPU optimizer adapter
        run: |
          python3 -m venv target/search/optimizer-venv
          target/search/optimizer-venv/bin/python -m pip install -r scripts/optimizer-requirements.txt
          target/search/optimizer-venv/bin/python scripts/test_search_optimizer.py

      - name: No unsafe, no std in the core
        run: |
          ! grep -rnw 'unsafe' crates/deflate-core/src/
          ! grep -rnw 'std' crates/deflate-core/src/

      - name: Lean model (lake build, no sorry/native_decide, axiom gate)
        run: |
          lake build
          if grep -rnwE 'sorry|admit|native_decide' spec/ --include='*.lean'; then
            echo "::error::sorry/admit/native_decide present in Lean sources"; exit 1
          fi
          sh scripts/axiom_gate.sh

      - name: Differential harness self-test
        run: python3 oracles/differential.py --self-test

      - name: Differential harness (Rust vs Lean model vs zlib)
        run: |
          cargo build --release --workspace
          lake build
          python3 oracles/differential.py
          python3 oracles/framing.py

      - name: Research emitter model witnesses
        run: python3 scripts/search_final_correspondence.py --published-only

      - name: Fuzz smoke (60s per target)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
          make fuzz
