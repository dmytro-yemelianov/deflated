[package]
name = "deflate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
deflate-core = { path = "../crates/deflate-core", features = ["research-tuning"] }
deflate-accel = { path = "../crates/deflate-accel" }
miniz_oxide = "0.8"
structured-codec = { path = "../crates/structured-codec" }

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false

[[bin]]
name = "dynamic_header"
path = "fuzz_targets/dynamic_header.rs"
test = false
doc = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "dynamic_lengths"
path = "fuzz_targets/dynamic_lengths.rs"
test = false
doc = false

[[bin]]
name = "structured_decode"
path = "fuzz_targets/structured_decode.rs"
test = false
doc = false

[[bin]]
name = "structured_roundtrip"
path = "fuzz_targets/structured_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "reuse"
path = "fuzz_targets/reuse.rs"
test = false
doc = false

[[bin]]
name = "gzip_header"
path = "fuzz_targets/gzip_header.rs"
test = false
doc = false

[[bin]]
name = "accel_gunzip"
path = "fuzz_targets/accel_gunzip.rs"
test = false
doc = false
